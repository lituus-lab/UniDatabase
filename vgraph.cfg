# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (sqlite -> sqlite.nim)
# or a directory (types -> types/*.nim). Modules under no listed layer are
# unconstrained: the umbrella module re-exports everything.
#
# A layer named here that no file answers to constrains nothing, and the check
# then passes on a graph it never looked at -- so these are the real modules,
# bottom-up: the raw SQLite declarations know nothing of the typed API, and the
# typed API knows nothing of the C caller.
[layers]
sqlite_raw
sqlite
c_api

# Uni* engines this repo may name in `requires`. Any Uni* absent here is a
# back-edge in the family DAG. Non-Uni deps (nim, NimContracts, nimsimd) are
# external infra and go unchecked.
# UniDatabase is a leaf: it wraps SQLite and depends on no sibling engine.
[engines]
